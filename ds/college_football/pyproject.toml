[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfb-season-dataset"
version = "0.1.0"
description = "Build a college football season dataset from public sources"
requires-python = ">=3.10"
dependencies = ["requests>=2.32,<3", "beautifulsoup4>=4.12,<5"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
