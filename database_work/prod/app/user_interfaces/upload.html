<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBSE Data Ingestion</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .upload-box {
            border: 2px dashed #aaa;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
        }
        button {padding: 10px 20px; cursor: pointer;}
        #status {margin-top: 20px;}
        table {width: 100%; border-collapse: collapse; margin-top: 20px;}
        th,
        td {border: 1px solid #ddd; padding: 8px; text-align: left;}
        th {background: #f3f3f3;}
        .success {color: green;}
        .error {color: darkred;}
        .actions {display: flex; gap: 8px;}
        .review-controls {display: flex; gap: 8px; margin: 12px 0;}
        .review-controls input {padding: 8px;}
    </style>
</head>

<body>
<h1>Prototype Data Ingestion</h1>
<h2>Upload CSV</h2>
<form id="upload-form">
    <div class="upload-box">
        <input type="file" id="csv-file" accept=".csv" required>
        <br><br>
        <button type="submit">
            Upload to Staging
        </button>
    </div>
</form>

<div id="status"></div>
<h2>Staging Area</h2>
<div class="review-controls">
    <input id="reviewer" type="text" placeholder="Reviewer name" required>
    <input id="decision-reason" type="text" placeholder="Decision reason" required>
</div>
<table>
    <thead>
        <tr>
            <th>Filename</th>
            <th>Records</th>
            <th>Validation</th>
            <th>Governance</th>
            <th>Upload UUID</th>
        </tr>
    </thead>
    <tbody id="staging-body">
    </tbody>
</table>


<script>
const form = document.getElementById("upload-form");
const status = document.getElementById("status");
const stagingBody = document.getElementById("staging-body");

form.addEventListener("submit", async function(event) {
    event.preventDefault();
    const fileInput = document.getElementById("csv-file");
    if (!fileInput.files.length) {
        showError("Please select a CSV file.");
        return;
    }

    const file = fileInput.files[0];
    const formData = new FormData();
    formData.append("file", file);
    status.textContent = "Uploading...";
    status.className = "";

    try {
        const response = await fetch(
            "/api/ingest/upload",
            {method: "POST", body: formData}
        );
        const result = await response.json();
        if (!response.ok) {
            throw new Error(
                result.detail?.message || result.detail || "Upload failed."
            );
        }
        showSuccess(`Successfully staged ${result.record_count} records. The batch is ready for governance review.`);
        form.reset();
        await loadUploads();
    }
    catch (error) {
        showError(error.message);
    }
});

function showSuccess(message) {
    status.textContent = message;
    status.className = "success";
}

function showError(message) {
    status.textContent = message;
    status.className = "error";
}

async function loadUploads() {
    const response = await fetch("/api/ingest/uploads");
    const uploads = await response.json();
    stagingBody.replaceChildren();
    for (const upload of uploads) addStagingRow(upload);
}

function addStagingRow(upload) {
    const row = document.createElement("tr");
    for (const value of [
        upload.filename,
        upload.record_count,
        upload.validation_status || upload.status,
    ]) {
        const cell = document.createElement("td");
        cell.textContent = String(value);
        row.appendChild(cell);
    }
    const governanceCell = document.createElement("td");
    if ((upload.validation_status || upload.status) === "VALIDATED" && (upload.governance_status || "PENDING") === "PENDING") {
        const actions = document.createElement("div");
        actions.className = "actions";
        for (const decision of ["APPROVED", "REJECTED"]) {
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = decision === "APPROVED" ? "Approve" : "Reject";
            button.addEventListener("click", () => submitDecision(upload.upload_uuid, decision));
            actions.appendChild(button);
        }
        governanceCell.appendChild(actions);
    } else {
        const latest = upload.decisions?.at(-1);
        governanceCell.textContent = latest
            ? `${latest.decision} by ${latest.decided_by}: ${latest.reason}`
            : "No decision";
    }
    row.appendChild(governanceCell);
    const uploadCell = document.createElement("td");
    uploadCell.textContent = upload.upload_uuid;
    row.appendChild(uploadCell);
    stagingBody.appendChild(row);
}

async function submitDecision(uploadUuid, decision) {
    const reviewer = document.getElementById("reviewer").value.trim();
    const reason = document.getElementById("decision-reason").value.trim();
    if (!reviewer || !reason) {
        showError("Enter a reviewer name and decision reason first.");
        return;
    }
    const response = await fetch(`/api/ingest/uploads/${uploadUuid}/governance`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({decision, decided_by: reviewer, reason}),
    });
    const result = await response.json();
    if (!response.ok) {
        showError(result.detail || "Governance decision failed.");
        return;
    }
    showSuccess(`Batch ${result.governance_status.toLowerCase()}. Decision recorded for audit.`);
    await loadUploads();
}

loadUploads().catch(() => showError("Could not load staged uploads."));
</script>
</body>
</html>
